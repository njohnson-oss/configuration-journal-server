---
name: Release

# Publishes a release for each version tag, with the tag's message as its
# notes. The tag must be annotated: a lightweight one has no message.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read the tag message
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$(git cat-file -t "$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag, so it has no message"
            exit 1
          fi
          # Subject and body, leaving out any signature.
          git tag --list "$TAG" --format='%(contents:subject)%0a%0a%(contents:body)' > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
