---
name: Agate release

# Agate is the one service unattended upgrades cannot update: the gemini
# role installs a release binary pinned by checksum, so a new release
# needs someone to bump gemini_version and its checksums. This fails when
# the pin falls behind, so that someone hears about it.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compare the pinned Agate with its latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^gemini_version: *//p' roles/gemini/vars/main.yml)
          if [ -z "$pinned" ]; then
            echo "::error file=roles/gemini/vars/main.yml::gemini_version not found"
            exit 1
          fi
          latest=$(gh api repos/mbrubeck/agate/releases/latest --jq .tag_name)
          latest=${latest#v}
          if [ "$pinned" != "$latest" ]; then
            echo "::error file=roles/gemini/vars/main.yml::Agate $latest is out, gemini_version pins $pinned. Bump it and both checksums."
            exit 1
          fi
          echo "Agate $pinned is the latest release."
