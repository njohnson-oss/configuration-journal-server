---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      # Pinned like the collections in requirements.yml, so a release
      # changes what CI runs only when it is bumped here.
      - name: Install tools
        run: pip install ansible-core==2.21.5 ansible-lint==26.9.0 ruff==0.17.0

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      # Also runs `ansible-playbook --syntax-check` on site.yml.
      - name: ansible-lint
        run: ansible-lint

      - name: ruff (filter plugins)
        run: ruff check filter_plugins

      # ansible-lint does not look inside .j2 files. This parses each one
      # without rendering it, so it catches syntax errors, not undefined
      # variables or filters.
      - name: Jinja template syntax
        shell: python
        run: |
          import pathlib, sys
          import jinja2

          env = jinja2.Environment(extensions=["jinja2.ext.do", "jinja2.ext.loopcontrols"])
          failed = False
          for path in sorted(pathlib.Path("roles").glob("*/templates/**/*.j2")):
              try:
                  env.parse(path.read_text(), filename=str(path))
              except jinja2.TemplateSyntaxError as exc:
                  print(f"::error file={path},line={exc.lineno}::{exc.message}")
                  failed = True
          sys.exit(failed)
