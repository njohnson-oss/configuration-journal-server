name: Deployment tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      # libsodium backs the onion_address filter; requests, community.docker;
      # molecule-plugins is the docker driver.
      - name: Install tools
        run: |
          sudo apt-get install -y libsodium23
          pip install ansible-core==2.22.0 molecule==26.11.0 'molecule-plugins[docker]==26.11.0' libnacl==2.1.0 requests==2.34.2

      - name: Install collections
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install -r molecule/default/collections.yml

      - name: molecule test
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
