---
# The main play becomes root through sudo and runs Python modules, fact
# gathering included, and minimal Debian images can ship without either.
# Install both first without become, over raw so nothing but a shell is
# needed; only the first run's root login can, and on later runs both are
# already there.
- name: Install sudo and Python before the main play needs them
  hosts: journal
  gather_facts: false
  become: false

  tasks:
    - name: Install sudo and Python if either is missing
      ansible.builtin.raw: >-
        { command -v sudo && command -v python3; } >/dev/null ||
        { apt-get update -qq &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo python3 &&
        echo BOOTSTRAP_INSTALLED; }
      register: bootstrap_install
      changed_when: "'BOOTSTRAP_INSTALLED' in bootstrap_install.stdout"
      tags: [always]

- name: Hardened web / Gemini / Git host reachable over TLS, Tor, and I2P
  hosts: journal
  become: true

  # Each role lists the roles it needs in its meta/main.yml, and Ansible
  # runs those first, once each, so any of them also runs alone. This
  # list only sets the order.
  roles:
    # First, though only the transports and services need it, so that a
    # full run refuses a missing key before anything is deployed. Untagged:
    # a run with tags runs it as a dependency of a role that needs it,
    # and not at all for one that does not, such as the content tags.
    - role: addresses
    # Order matters: open the firewall, harden sshd, then bring the
    # transports up before the services that advertise their addresses.
    # Every other role depends on common, so it runs with any tags. A tag
    # here would make it a second, separate entry, run twice.
    - role: common
    # Each with both tags: the firewall admits only ssh_port, so after a
    # change to it, running either role without the other locks the next
    # connection out.
    - role: firewall
      tags: [firewall, ssh]
    - role: ssh_hardening
      tags: [ssh, firewall]
    - role: tor
      tags: [tor]
    - role: i2p
      tags: [i2p]
    - role: caddy
      tags: [caddy, web, cgit]
    - role: website
      tags: [web]
    - role: gemini
      tags: [gemini]
    - role: cgit
      tags: [cgit]
