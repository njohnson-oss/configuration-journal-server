---
# The onion and I2P addresses the transports publish and the services
# advertise, derived on the controller from the keys the user supplies.
# tor, i2p and every service that names an address depend on this role.
- name: Refuse to deploy without the onion service secret key
  ansible.builtin.assert:
    that:
      - (tor_onion_key_dir ~ '/hs_ed25519_secret_key') is file
    fail_msg: >-
      missing {{ tor_onion_key_dir }}/hs_ed25519_secret_key — keep the
      secret key between rebuilds, or the .onion address changes every
      time.
    quiet: true

- name: Derive the onion address from the supplied service key
  ansible.builtin.set_fact:
    addresses_onion_hostname: "{{ (tor_onion_key_dir ~ '/hs_ed25519_secret_key') | onion_address }}"

- name: Name cgit's subdomain of the onion
  ansible.builtin.set_fact:
    addresses_cgit_onion_hostname: "{{ cgit_onion_subdomain }}.{{ addresses_onion_hostname }}"

- name: Refuse to deploy without every I2P destination key
  ansible.builtin.assert:
    that:
      - (i2p_key_dir ~ '/' ~ item ~ '.dat') is file
    fail_msg: >-
      missing {{ i2p_key_dir }}/{{ item }}.dat — the destination key must
      exist on the controller before deploy, and its contents must persist
      across rebuilds, or the .b32.i2p address changes every time.
    quiet: true
  loop: [web, gemini, cgit]

- name: Derive the I2P destination address of each supplied tunnel key
  ansible.builtin.set_fact:
    addresses_i2p: "{{ addresses_i2p | default({}) | combine({item: (i2p_key_dir ~ '/' ~ item ~ '.dat') | i2p_b32}) }}"
  loop: [web, gemini, cgit]

- name: Show the addresses this host will answer to
  ansible.builtin.debug:
    msg:
      - "web     : https://{{ web_domain }} | http://{{ addresses_onion_hostname }} | http://{{ addresses_i2p.web }}"
      - "gemini  : gemini://{{ gemini_domain }} | gemini://{{ addresses_onion_hostname }} | gemini://{{ addresses_i2p.gemini }}"
      - "cgit    : https://{{ cgit_domain }} | http://{{ addresses_cgit_onion_hostname }} | http://{{ addresses_i2p.cgit }}"
