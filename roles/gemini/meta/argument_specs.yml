---
# The values this role reads from inventory. Ansible checks them before
# the role's first task, so a missing or mistyped one stops the play
# there instead of partway through a deploy. Only those without a
# default are required. The others default in the role responsible for
# each: this one, or common or addresses, which it depends on.
argument_specs:
  main:
    short_description: The Gemini capsule, served by Agate
    options:
      gemini_domain:
        type: str
        description: The capsule's clearnet name.
      gemini_certificates:
        type: dict
        description: Certificates by hostname, each a dict of cert and key paths.
      gemini_capsule_source:
        type: str
        description: Local directory rsynced as the capsule, "" for a placeholder.
      gemini_lang:
        type: str
        description: Language of the capsule's text/gemini pages.
