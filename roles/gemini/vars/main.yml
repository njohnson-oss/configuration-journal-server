---
# ═══════════════════════════════════════════════════════════════════════
#  The pinned Agate release, crypto policy and names for the capsule.
#  Role vars: not settable from inventory.
# ═══════════════════════════════════════════════════════════════════════

# Agate is Rust. It is not packaged for Debian, so the release binary is
# fetched and pinned by checksum: sha256 of the published .gz, per
# target triple. Update the version and the checksums together --
# get_url refuses the download if they disagree. Unattended upgrades
# cannot do this; .github/workflows/agate.yml fails when a newer release
# is out.
gemini_version: 3.3.24
gemini_release_checksums:
  x86_64-unknown-linux-gnu: 32379846ff14ce980377455bd935dd8635c56c61a0f336fb76aa461195110404
  aarch64-unknown-linux-gnu: 5e5e2f81d127da77a4b12e78d3d06e28b639246103bf9e8508bdb0103429b8f2

# Matches the clearnet minimum TLS version in roles/common.
gemini_only_tls13: true

# Self-signed material generated for any hostname not listed in
# gemini_certificates. Gemini is trust-on-first-use, so a long life is
# important. Each hostname gets its own key and certificate. Clients
# check the name against the certificate, and with separate certificates,
# changing one address doesn't break the certificates clients have
# already saved for the others. (The addresses are published on the
# capsule, so this is not about keeping the transports unlinked.)
gemini_cert_days: "+3650d"
gemini_key_type: Ed25519

# The names the capsule answers to, one per transport: its clearnet
# domain, the onion, and its own I2P destination.
gemini_hostnames:
  - "{{ gemini_domain }}"
  - "{{ addresses_onion_hostname }}"
  - "{{ addresses_i2p.gemini }}"
