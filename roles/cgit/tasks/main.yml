---
- name: Create the cgit group
  ansible.builtin.group:
    name: "{{ cgit_group }}"
    system: true
    state: present

- name: Create the cgit service user
  ansible.builtin.user:
    name: "{{ cgit_user }}"
    group: "{{ cgit_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ cgit_repo_root }}"
    create_home: false
    state: present

# A pusher sshd turns away could never push, so catch it here rather than
# as a refused login.
- name: Refuse pushers who cannot log in over SSH
  ansible.builtin.assert:
    that:
      - cgit_pushers | difference(ssh_allowed_users) | length == 0
    fail_msg: >-
      {{ cgit_pushers | difference(ssh_allowed_users) | join(', ') }} in
      cgit_pushers but not in ssh_allowed_users, so sshd would refuse them.
    quiet: true

# Pushes write to the repositories as the pusher, not as cgit. They are
# shared with the cgit group, so membership is what lets a push in.
- name: Let the pushers write to the repositories
  ansible.builtin.user:
    name: "{{ item }}"
    groups: ["{{ cgit_group }}"]
    append: true
  loop: "{{ cgit_pushers }}"

- name: Install cgit and the FastCGI wrapper
  ansible.builtin.apt:
    name: "{{ cgit_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable the packaged fcgiwrap units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop:
    - fcgiwrap.socket
    - fcgiwrap.service

- name: Create the repository and cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ cgit_user }}"
    group: "{{ cgit_group }}"
    mode: "0755"
  loop:
    - "{{ cgit_repo_root }}"
    - "{{ cgit_cache_dir }}"

# ── Repositories ──────────────────────────────────────────────────────
- name: Mirror the repositories that have an upstream
  ansible.builtin.git:
    repo: "{{ item.source }}"
    dest: "{{ cgit_repo_root }}/{{ item.name }}.git"
    bare: true
    update: true
    version: "{{ item.version | default('HEAD') }}"
  become: true
  become_user: "{{ cgit_user }}"
  loop: "{{ cgit_repositories | selectattr('source', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

# --shared=group keeps everything git writes group-writable, whichever
# pusher writes it, so the next pusher can write over it.
- name: Initialise the repositories that have no upstream
  ansible.builtin.command:
    cmd: >-
      git init --bare --shared=group --object-format={{ cgit_object_format }}
      --initial-branch={{ cgit_initial_branch }} {{ cgit_repo_root }}/{{ item.name }}.git
    creates: "{{ cgit_repo_root }}/{{ item.name }}.git/HEAD"
  become: true
  become_user: "{{ cgit_user }}"
  loop: "{{ cgit_repositories | rejectattr('source', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

# Repositories initialised before --shared=group are only cgit's to
# write. Share them once; git keeps them shared from then on.
- name: Share the older repositories with the pushers
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      case "$(git config --get core.sharedRepository || true)" in
        1|group|true) exit 0 ;;
      esac
      git config core.sharedRepository group
      chmod -R g+rwX .
      find . -type d -exec chmod g+s {} +
      echo changed
    chdir: "{{ cgit_repo_root }}/{{ item.name }}.git"
    executable: /bin/bash
  become: true
  become_user: "{{ cgit_user }}"
  register: cgit_share
  changed_when: cgit_share.stdout == 'changed'
  loop: "{{ cgit_repositories | rejectattr('source', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

# git-receive-pack refuses a repository its user does not own, and these
# are cgit's. Listed one by one: safe.directory takes no wildcard before
# git 2.46.
- name: Let the pushers' git trust the repositories
  ansible.builtin.blockinfile:
    path: /etc/gitconfig
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} cgit repositories, managed by Ansible"
    block: |
      [safe]
      {% for repo in cgit_repositories | rejectattr('source', 'defined') %}
        directory = {{ cgit_repo_root }}/{{ repo.name }}.git
      {% endfor %}

# ── Idle times ────────────────────────────────────────────────────────
# cgit's contrib/hooks/post-receive.agefile, plus a umask so that every
# pusher can rewrite what another wrote. It writes the newest commit date
# to info/web/last-modified, cgit's default agefile.
- name: Update the agefile on every push
  ansible.builtin.copy:
    src: post-receive
    dest: "{{ cgit_repo_root }}/{{ item.name }}.git/hooks/post-receive"
    owner: "{{ cgit_user }}"
    group: "{{ cgit_group }}"
    mode: "0755"
  loop: "{{ cgit_repositories }}"
  loop_control:
    label: "{{ item.name }}"

# Mirrors are only fetched, never pushed to, so their hook has to be run
# here. A repository without refs gets an empty agefile, which is removed
# so cgit shows no age at all.
- name: Record each mirror's newest commit date
  ansible.builtin.shell:
    cmd: |
      set -e
      agefile=info/web/last-modified
      old=$(cat "$agefile" 2>/dev/null || echo absent)
      hooks/post-receive
      [ -s "$agefile" ] || rm -f "$agefile"
      new=$(cat "$agefile" 2>/dev/null || echo absent)
      [ "$old" = "$new" ] || echo changed
    chdir: "{{ cgit_repo_root }}/{{ item.name }}.git"
  become: true
  become_user: "{{ cgit_user }}"
  register: cgit_agefile_update
  changed_when: cgit_agefile_update.stdout == 'changed'
  loop: "{{ cgit_repositories | selectattr('source', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write the cgit configuration
  ansible.builtin.template:
    src: cgitrc.j2
    dest: "{{ cgit_config_path }}"
    owner: root
    group: "{{ cgit_group }}"
    mode: "0644"

# ── FastCGI wrapper ───────────────────────────────────────────────────
- name: Install the socket unit
  ansible.builtin.template:
    src: cgit-fcgiwrap.socket.j2
    dest: "/etc/systemd/system/{{ cgit_fcgiwrap_service }}.socket"
    owner: root
    group: root
    mode: "0644"
  notify: restart cgit fcgiwrap

- name: Install the service unit
  ansible.builtin.template:
    src: cgit-fcgiwrap.service.j2
    dest: "/etc/systemd/system/{{ cgit_fcgiwrap_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: restart cgit fcgiwrap

- name: Enable the FastCGI socket
  ansible.builtin.systemd_service:
    name: "{{ cgit_fcgiwrap_service }}.socket"
    enabled: true
    state: started
    daemon_reload: true

- name: Write the vhost
  ansible.builtin.template:
    src: cgit.caddy.j2
    dest: "{{ cgit_vhost_path }}"
    owner: root
    group: "{{ caddy_group }}"
    mode: "0640"
  notify: reload caddy
