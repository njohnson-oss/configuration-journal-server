---
cgit_packages: [cgit, fcgiwrap, git]

cgit_user: cgit
cgit_group: cgit
cgit_repo_root: /srv/git
cgit_cache_dir: /var/cache/cgit
cgit_config_path: /etc/cgitrc

cgit_cgi: /usr/lib/cgit/cgit.cgi
cgit_static_dir: /usr/share/cgit
cgit_git_http_backend: /usr/lib/git-core/git-http-backend

cgit_socket: /run/cgit-fcgiwrap.sock
cgit_fcgiwrap_binary: /usr/sbin/fcgiwrap
cgit_fcgiwrap_service: cgit-fcgiwrap

cgit_vhost_path: "{{ caddy_sites_dir }}/20-cgit.caddy"
cgit_hsts: "max-age=31536000; includeSubDomains"

cgit_cache_size: 1000

# ── Deployment choices ────────────────────────────────────────────────
# Described in inventory/group_vars/all/main.yml, which lists each
# commented out.
cgit_root_title: "{{ web_domain }} repositories"
cgit_root_desc: "public git repositories"
cgit_default_owner: "{{ admin_user }}"
cgit_snapshots: "tar.gz zip"
cgit_initial_branch: main
cgit_pushers: ["{{ admin_user }}"]
cgit_repositories: []
