---
# Implementation detail only. The algorithm policy lives in
# vars/main.yml, where inventory cannot reach it.
ssh_hardening_packages: [openssh-client]  # `ssh -Q kex`, used to probe PQ support

ssh_hardening_dropin_path: /etc/ssh/sshd_config.d/10-hardening.conf
ssh_hardening_service: ssh

ssh_hardening_max_auth_tries: 3
ssh_hardening_login_grace: 20s
ssh_hardening_client_alive_interval: 300
ssh_hardening_client_alive_count_max: 2
