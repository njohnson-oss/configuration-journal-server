---
# The values this role reads from inventory. Ansible checks them before
# the role's first task, so a missing or mistyped one stops the play
# there instead of partway through a deploy. Only those without a
# default are required. The others default in the role responsible for
# each: this one, or common or addresses, which it depends on.
argument_specs:
  main:
    short_description: sshd, keys only, for the listed accounts
    options:
      ssh_port:
        type: int
        description: The port sshd listens on.
      ssh_allowed_users:
        type: list
        elements: str
        description: Accounts that may log in over SSH.
