---
- name: Create the sshd drop-in directory
  ansible.builtin.file:
    path: "{{ ssh_hardening_dropin_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure sshd reads its drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    state: present
    validate: "/usr/sbin/sshd -t -f %s"

- name: Fall back to the Ed25519 host key when none is configured
  ansible.builtin.set_fact:
    ssh_hardening_host_keys_effective: "{{ ssh_hardening_host_keys | default([], true) or ['/etc/ssh/ssh_host_ed25519_key'] }}"

# HostKeyAlgorithms admits only Ed25519, so that is the only type worth
# generating. Runs before the template so its `sshd -t` finds a key.
- name: Generate missing host keys
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, "", -f, "{{ item }}"]
    creates: "{{ item }}"
  loop: "{{ ssh_hardening_host_keys_effective }}"
  notify: restart sshd

- name: Install the hardened configuration
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: "{{ ssh_hardening_dropin_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: restart sshd

- name: Remove host keys that are not in ssh_hardening_host_keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ssh/ssh_host_rsa_key
    - /etc/ssh/ssh_host_rsa_key.pub
    - /etc/ssh/ssh_host_ecdsa_key
    - /etc/ssh/ssh_host_ecdsa_key.pub
  when: (item | regex_replace('\.pub$', '')) not in ssh_hardening_host_keys_effective
  notify: restart sshd

- name: Enable sshd
  ansible.builtin.systemd_service:
    name: "{{ ssh_hardening_service }}"
    enabled: true
    state: started

# sshd now refuses root and may have moved port. The open connection
# outlives the restart, but anything that logs in afresh, synchronize's
# rsync or a reconnect after ControlPersist lapses, would still use the
# inventory's account and port. Apply the change now and carry on as an
# account it lets in. A first run logs in as root, so it switches to
# admin_user here; set_fact outranks inventory, but not -e.
- name: Apply the firewall and sshd changes
  ansible.builtin.meta: flush_handlers

- name: Log in as an allowed account on ssh_port from here on
  ansible.builtin.set_fact:
    ansible_user: "{{ ansible_user if ansible_user | default('') in ssh_allowed_users else admin_user }}"
    ansible_port: "{{ ssh_port }}"

- name: Drop the connection made before sshd was hardened
  ansible.builtin.meta: reset_connection

- name: Wait for sshd to accept the new login
  ansible.builtin.wait_for_connection:
    timeout: "{{ ssh_hardening_reconnect_timeout }}"
