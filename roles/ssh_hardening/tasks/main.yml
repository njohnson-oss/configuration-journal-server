---
- name: Install the OpenSSH client
  ansible.builtin.apt:
    name: "{{ ssh_hardening_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the sshd drop-in directory
  ansible.builtin.file:
    path: "{{ ssh_hardening_dropin_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure sshd reads its drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    state: present
    validate: "/usr/sbin/sshd -t -f %s"

- name: Ask OpenSSH which key exchange algorithms it implements
  ansible.builtin.command: ssh -Q kex
  changed_when: false
  register: ssh_hardening_kex_available

- name: Keep only the post-quantum algorithms this build offers
  ansible.builtin.set_fact:
    ssh_hardening_kex_effective: "{{ ssh_hardening_kex_preferred | select('in', ssh_hardening_kex_available.stdout_lines) | list }}"

- name: Refuse to continue without a post-quantum key exchange
  ansible.builtin.assert:
    that:
      - ssh_hardening_kex_effective | length > 0
    fail_msg: >-
      This host's OpenSSH supports none of {{ ssh_hardening_kex_preferred | join(', ') }}.
      sntrup761x25519 needs OpenSSH >= 8.5, mlkem768x25519 needs >= 9.9.
      Upgrade OpenSSH. ssh_hardening_kex_preferred is role policy, not a setting;
      relaxing it for one run needs an explicit -e and drops the
      post-quantum guarantee this playbook exists to provide.
    quiet: true

- name: Fall back to the Ed25519 host key when none is configured
  ansible.builtin.set_fact:
    ssh_hardening_host_keys_effective: "{{ ssh_hardening_host_keys | default([], true) or ['/etc/ssh/ssh_host_ed25519_key'] }}"

- name: Collect service facts
  ansible.builtin.service_facts:

- name: Disable socket activation so sshd_config owns the listener
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
  when: "'ssh.socket' in (ansible_facts.services | default({}))"
  notify: restart sshd

# HostKeyAlgorithms admits only Ed25519, so that is the only type worth
# generating. Runs before the template so its `sshd -t` finds a key.
- name: Generate missing host keys
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, "", -f, "{{ item }}"]
    creates: "{{ item }}"
  loop: "{{ ssh_hardening_host_keys_effective }}"
  notify: restart sshd

- name: Install the hardened configuration
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: "{{ ssh_hardening_dropin_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: restart sshd

- name: Remove host keys that are not in ssh_hardening_host_keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ssh/ssh_host_rsa_key
    - /etc/ssh/ssh_host_rsa_key.pub
    - /etc/ssh/ssh_host_ecdsa_key
    - /etc/ssh/ssh_host_ecdsa_key.pub
  when: (item | regex_replace('\.pub$', '')) not in ssh_hardening_host_keys_effective
  notify: restart sshd

- name: Enable sshd
  ansible.builtin.systemd_service:
    name: "{{ ssh_hardening_service }}"
    enabled: true
    state: started
