---
- name: Install Tor
  ansible.builtin.apt:
    name: "{{ tor_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the onion service directory
  ansible.builtin.file:
    path: "{{ tor_service_dir }}"
    state: directory
    owner: "{{ tor_user }}"
    group: "{{ tor_user }}"
    mode: "0700"

- name: Install the supplied onion service secret key
  ansible.builtin.copy:
    src: "{{ tor_onion_key_dir }}/{{ tor_secret_key_filename }}"
    dest: "{{ tor_service_dir }}/{{ tor_secret_key_filename }}"
    owner: "{{ tor_user }}"
    group: "{{ tor_user }}"
    mode: "0600"
  no_log: true
  register: tor_installed_key
  notify: restart tor

# Both are regenerated from the secret key at startup. Left in place
# after a key swap they describe the *old* service, and tor refuses to
# start on a public key that does not match the secret one.
- name: Clear the files tor derives whenever the secret key changed
  ansible.builtin.file:
    path: "{{ tor_service_dir }}/{{ item }}"
    state: absent
  loop: "{{ tor_derived_filenames }}"
  when: tor_installed_key is changed
  notify: restart tor

- name: Write torrc
  ansible.builtin.template:
    src: torrc.j2
    dest: "{{ tor_config_path }}"
    owner: root
    group: "{{ tor_user }}"
    mode: "0640"
  notify: restart tor

- name: Enable Tor
  ansible.builtin.systemd_service:
    name: "{{ tor_service }}"
    enabled: true
    state: started

# ── Confirm the address the rest of the play is about to advertise ────
# The vhosts, the Gemini server blocks and their certificates are all named
# after the address derived from the secret key on the controller. Tor
# derives the same address independently; if the two ever disagree, stop
# here rather than deploy a stack that answers to a name nobody can reach.
# flush_handlers is play-wide, so any earlier role's handler runs here too.
# That is only a change of timing — they would all run at the end of the
# play anyway, and nothing later in the play depends on them not having run.
- name: Apply the Tor configuration before reading back the addresses
  ansible.builtin.meta: flush_handlers

- name: Wait for tor to publish the onion hostname
  ansible.builtin.wait_for:
    path: "{{ tor_service_dir }}/hostname"
    timeout: "{{ tor_hostname_timeout }}"

- name: Read back the published onion hostname
  ansible.builtin.slurp:
    src: "{{ tor_service_dir }}/hostname"
  register: tor_published_hostname

- name: Check the published address against the one derived from the key
  ansible.builtin.assert:
    that:
      - tor_published_hostname.content | b64decode | trim == onion_hostname
    fail_msg: >-
      tor published {{ tor_published_hostname.content | b64decode | trim }},
      the controller derived {{ onion_hostname }} from
      {{ tor_onion_key_dir }}/{{ tor_secret_key_filename }}.
    quiet: true
