---
# Package names, paths and versions (cgit's SHA-256 support among them)
# are chosen for these releases only.
- name: Refuse to deploy to anything but Debian 12 or 13
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] in ['12', '13']
    fail_msg: >-
      This playbook supports Debian 12 and 13 only; the host runs
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    quiet: true

- name: Refuse to deploy without the user's SSH keys
  ansible.builtin.assert:
    that:
      - admin_authorized_keys | length > 0
    fail_msg: >-
      admin_authorized_keys is empty. Pass the public key(s) at
      deploy time. E.g: -e '{"admin_authorized_keys":["ssh-ed25519 AAAA..."]}'
    quiet: true

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the administrative user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: "{{ common_admin_groups }}"
    append: true
    shell: "{{ common_admin_shell }}"
    create_home: true
    state: present

- name: Install the user's SSH keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_authorized_keys | join('\n') }}"
    exclusive: true

- name: Grant the administrative user sudo without a password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/10-{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

# Sorts after the packaged 50unattended-upgrades, so these values win.
- name: Reboot automatically when an upgrade requires it
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
    owner: root
    group: root
    mode: "0644"

# Unattended runs have nobody to answer needrestart's default interactive prompt.
- name: Restart services automatically after library upgrades
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/50-autorestart.conf
    content: |
      $nrconf{restart} = 'a';
    owner: root
    group: root
    mode: "0644"

- name: Start the unattended upgrade timer
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started
