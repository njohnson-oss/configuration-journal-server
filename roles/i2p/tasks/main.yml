---
# With both off the router has no transport, and is useless rather than
# private. Refused before anything is installed.
- name: Refuse a router with neither IPv4 nor IPv6
  ansible.builtin.assert:
    that: i2p_ipv4 or i2p_ipv6
    fail_msg: >-
      i2p_ipv4 and i2p_ipv6 are both false, which leaves i2pd no way to
      reach other routers. Turn on at least one.
    quiet: true

- name: Install i2pd
  ansible.builtin.apt:
    name: "{{ i2p_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the destination keys
  ansible.builtin.copy:
    src: "{{ i2p_key_dir }}/{{ item.name }}.dat"
    dest: "{{ i2p_data_dir }}/{{ item.name }}.dat"
    owner: "{{ i2p_user }}"
    group: "{{ i2p_group }}"
    mode: "0600"
  loop: "{{ i2p_server_tunnels }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: restart i2pd

- name: Write the router configuration
  ansible.builtin.template:
    src: i2pd.conf.j2
    dest: "{{ i2p_config_path }}"
    owner: root
    group: "{{ i2p_group }}"
    mode: "0640"
  notify: restart i2pd

- name: Write the server tunnels
  ansible.builtin.template:
    src: tunnels.conf.j2
    dest: "{{ i2p_tunnels_path }}"
    owner: root
    group: "{{ i2p_group }}"
    mode: "0640"
  notify: restart i2pd

- name: Enable i2pd
  ansible.builtin.systemd_service:
    name: "{{ i2p_service }}"
    enabled: true
    state: started
